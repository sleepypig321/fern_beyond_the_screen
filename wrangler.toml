name = "fern-beyond-the-screen"
compatibility_date = "2026-11-22"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Approval-only private chat: a SQLite-backed Durable Object.
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v1-chat-hub"
new_sqlite_classes = ["ChatHub"]
