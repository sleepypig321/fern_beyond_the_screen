name = "fern-beyond-the-screen"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Reuse the Sites by Fern dynamic EmailJS decision template.
# Keep account and service credentials in the Cloudflare Worker secrets.
[vars]
EMAILJS_DECISION_TEMPLATE_ID = "template_kik3zps"

# Approval-only private chat: a SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v1-chat-hub"
new_sqlite_classes = ["ChatHub"]
