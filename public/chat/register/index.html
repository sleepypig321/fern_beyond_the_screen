<body><header class="chat-top"><a class="brand" href="/"><img src="/assets/mushroom-mark.svg" alt=""><strong>Fern, Beyond the Screen</strong></a><a href="/inquire/">The doorway</a></header>
<main class="center-panel"><span class="eyebrow">BY INVITATION ONLY · 25+</span><h1>A private<br><em>invitation.</em></h1>
<p id="invite-intro">Checking your private invitation…</p><form id="register-form" hidden>
<label for="new-password">Create a password (at least 12 characters)</label>
<input type="password" name="password" id="new-password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="repeat-password">Confirm your password</label>
<input type="password" name="password_confirm" id="repeat-password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button type="submit" class="primary">Activate my private chat</button></form>
<p id="reg-status" role="status" class="status"></p><p class="foot">Only people whose introductions Fern personally approves can create an account. Every invitation is unique and expires after seven days.</p>
<a href="/chat/" class="text-link">Already registered? Sign in</a>
</main><script src="/chat/chat.js" defer></script></body></html>
